name: is373-rag
services:
  web:
    build: .
    image: is373-rag:build-2
    container_name: is373-rag
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
    volumes:
      - app-data:/data
    networks: [private, proxy]
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
      QDRANT__SERVICE__MAX_WORKERS: '1'
    volumes:
      - vectors:/qdrant/storage
    networks: [private]
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
networks:
  private:
    internal: true
  proxy:
    external: true
    name: traefik-proxy
volumes:
  app-data:
  vectors:
